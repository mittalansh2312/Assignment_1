<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 18</title>
</head>
<body>
    <header>
        <h1><center><strong>ABC College Admission 2026</strong></center></h1>
    </header>
    <p> <h3> Course and Fees</h3></p>
    <p><center>Available Courses</center></p>
    <center>
    <table border="1" cellspacing="0" cellpadding="8" width="70%">
      <thead>  
         <tr>
            <th>Course</th>
            <th>Seats</th>
            <th>Fees</th>
         </tr>
      </thead>
      <tbody> 
        <tr>
            <td>B.Tech CSE</td>
            <td>120</td>
            <td>&#8377; 90,000</td>
        </tr>
        <tr>
            <td>BCA</td>
            <td>60</td>
            <td>&#8377; 45,000</td>
        </tr>
       </tbody>
    </table>
    </center>
    <br>
    <form>
        <fieldset>
            <legend>Admission Form</legend>
            <label for="name">Name:</label><br><br>
            <input type="text" id="name" name="name" required><br><br>
            <label for="email">Email:</label><br><br>
            <input type="email" id="email" name="email" required><br><br>
            <label for="course">Course:</label><br><br>
            <select id="course" name="course" required>
               
                <option value="B.Tech CSE">B.Tech CSE</option>
                <option value="BCA">BCA</option>
            </select><br><br>
            <label for="statement">Statement:</label><br>
            <textarea id="statement" name="statement" rows="4" cols="40" required></textarea><br><br>
            
            <button type="submit">Apply</button>
        </fieldset>
    </form>
    
    <footer>
        <p><center>&copy; 2026 ABC College</center></p>
    </footer>
</body>
</html>
